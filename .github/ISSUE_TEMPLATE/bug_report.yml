name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。提交前请移除服务器地址、凭证、玩家信息、个人路径、日志和世界数据。
  - type: input
    id: version
    attributes:
      label: ArkMC Studio 版本
      placeholder: 例如 1.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与系统架构
      placeholder: 例如 Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用最小步骤说明如何触发问题。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏错误信息
      description: 仅粘贴与问题有关且已脱敏的片段，不要上传数据库、完整日志或诊断包。
      render: text
    validations:
      required: false
