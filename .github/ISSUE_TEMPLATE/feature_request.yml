name: 功能建议
description: 提出一个具体的产品或开发改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 请先搜索现有 Issue，并描述实际的服务器管理场景。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的工作流程哪里受阻？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明你希望程序如何响应。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
