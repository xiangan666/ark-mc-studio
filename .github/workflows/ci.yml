name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26.13.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Normalize Windows temporary directory
        shell: pwsh
        run: |
          $tempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw '无法解析临时目录的真实路径' }
          "TEMP=$tempPath" >> $env:GITHUB_ENV
          "TMP=$tempPath" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  integration:
    name: Windows integration
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/nethernet-route-check/go.mod
          cache-dependency-path: tools/nethernet-route-check/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.20"
          enable-cache: false
      - name: Normalize Windows temporary directory
        shell: pwsh
        run: |
          $tempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw '无法解析临时目录的真实路径' }
          "TEMP=$tempPath" >> $env:GITHUB_ENV
          "TMP=$tempPath" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run test:python
      - run: npm run test:go
      - run: npm run audit:go
      - run: npm run prepare:resources
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:program-ui
      - run: npm run test:session
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-integration-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
